<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/aspxtreme/aps-images@main/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/aspxtreme/aps-images@main/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://cdn.jsdelivr.net/gh/aspxtreme/aps-images@main/favicon-16x16.png">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/aspxtreme/aps-images@main/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <title>All Star Property Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden Netlify Forms for form detection -->
    <form name="homepage-contact" method="POST" data-netlify="true" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="propertyType">
        <option value="">Select Property Type</option>
        <option value="commercial">Commercial</option>
        <option value="multi-family">Multi-Family</option>
        <option value="industrial">Industrial</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
      <input type="file" name="attachments" multiple />
      <input type="hidden" name="source" />
      <input type="hidden" name="bot-field" />
    </form>

    <form name="contactpage-contact" method="POST" data-netlify="true" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="propertyType">
        <option value="">Select Property Type</option>
        <option value="commercial">Commercial</option>
        <option value="multi-family">Multi-Family</option>
        <option value="industrial">Industrial</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
      <input type="file" name="attachments" multiple />
      <input type="hidden" name="source" />
      <input type="hidden" name="bot-field" />
    </form>
  </body>
</html>
